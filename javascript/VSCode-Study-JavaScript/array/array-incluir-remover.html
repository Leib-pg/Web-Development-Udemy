<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>array incluir e remover</title>
<script>

    var lista_coisas = [];
    
  lista_coisas[1] = Array();
  lista_coisas[2] = [];

  // Adiciona um item no final do array
    lista_coisas.push("maçã");
  // Adiciona um item no início do array
    lista_coisas.unshift("melancia");
  // Remove o último item do array
    lista_coisas.pop();
  // Remove o primeiro item do array
    lista_coisas.shift();

</script>

</head>
<body>

</body>
</html>
