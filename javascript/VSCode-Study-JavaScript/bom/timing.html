<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ultilizando setTimeout e setInterval</title>
<script>

    //setTimeout( <ação>, <tempo em milisegundos>); <--- Executa ação uma vez após o tempo informado
    //clearTimeout()

    //setInterval(<ação>, <tempo e milisegundos>);
    //clearInterval()  <--- sempre executa a ação após o período informado

    //exemplos:

    // setTimeout(function() { document.write('Teste' + '<br />') }, 2000)

    var i = 5

    var x = setInterval(function() {
      document.write(i)
      i--

      if(i == 0) {
        //Window.location.reload()
        clearInterval(x)
      }
    }, 1000)

</script>

</head>
<body>

</body>
</html>
