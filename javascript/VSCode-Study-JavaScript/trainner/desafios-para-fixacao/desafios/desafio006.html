<!DOCTYPE html>
<html lang="en"></html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>media de notas</title>
<script>

let soma = 0;

  for(let i = 0; i < 4; i++){
    let nota = parseFloat(prompt('Digite a nota:'));
    soma += nota;

  }

let media = soma / 4;
alert('A MEDIA É: ' + media + ' PONTOS');
</script>
</head>
<body>
  
  :root

  <input type='button' value='Calcular Média' onclick='red'/>
</body>
</html>
