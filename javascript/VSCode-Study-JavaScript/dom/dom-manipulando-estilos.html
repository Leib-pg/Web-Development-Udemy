<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mudança de cor de elementos</title>
    <script>
      function modificarEstilo(cor, l, a) {
        document.getElementById("quadrado").style.backgroundColor = cor;
        document.getElementById("quadrado").style.width = l;
        document.getElementById("quadrado").style.height = a;
      }
    </script>
  </head>
  <body>
    <h3>Manipulando estilo</h3>

    <div
      style="width: 100px; height: 100px; background-color: #000"
      id="quadrado"
    ></div>

    <hr />
    <button
      type="button"
      onclick="modificarEstilo('#FF0000', '300px', '120px')"
    >
      Vermelho
    </button>
    <button type="button" onclick="modificarEstilo('#00FF00', '100px', '20px')">
      Verde
    </button>
    <button
      type="button"
      onclick="modificarEstilo('#0000FF', '300px', '100px')"
    >
      Azul
    </button>
  </body>
</html>
