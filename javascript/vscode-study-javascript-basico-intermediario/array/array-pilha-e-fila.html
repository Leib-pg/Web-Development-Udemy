<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>array pilha e fila</title>
  <script>

    const lista = [];
    lista[0] = 'Primeiro'
    lista[1] = 'Segundo'
    lista[2] = 'Terceiro'
    lista[3] = 'Quarto'

    console.log(lista)

    // Pilha - LIFO (last in, first out)
    console.log('--- Pilha - LIFO ---')
    lista.push('Quinto')
    console.log(lista)
    const removidoPilha = lista.pop()
    console.log('Removida da Pilha:', removidoPilha)
    console.log(lista)

  </script>
</head>
<body>

</body>
</html>
