<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<script>

  var lista_frutas = array();

  lista_frutas[0] = ("Banana");
  lista_frutas[1] = ("Maçã");
  lista_frutas[2] = ("Laranja");
  lista_frutas[3] = ("Uva");
  lista_frutas[4] = ("Pera");



  // (indexof) Pesquisar o índice de um elemento no array
  // Se o elemento não existir, retorna -1
  console.log(lista_frutas.indexof("Uva")); // 3
  console.log(lista_frutas.indexof("Mamão")); // -1

var auxiliar = lista_frutas.indexof();

  if(auxiliar ==- -1)
  {
    console.log("Elemento não encontrado");
  }
  else
  {
    console.log("Elemento encontrado no índice: " + auxiliar);
  }


</script>
</head>
<body>

</body>
</html>
