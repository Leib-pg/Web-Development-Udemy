<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>objeto literal inclusao atributos</title>
  <script>
    let pessoa = {
      nome: 'kaua',
      idade: 18,

    }

    console.log(pessoa)

    //-----------------

    pessoa.sexo = 'feminino';

    console.log(pessoa)

    //arrow function
    pessoa.dizeroi = () => console.log('Olá, tudo bem? ')

    pessoa.dizeroi()

  </script>
</head>
<body>

</body>
</html>
