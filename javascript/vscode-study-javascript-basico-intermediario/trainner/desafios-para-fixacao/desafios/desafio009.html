  <title>desafio009 -> funçao que recebe array e retorna a soma de todos os numero</title>
  <script>

    const somaDeNumeros = (...numeros) => {
      return numeros.reduce ((total, num) => total + num, 0);
    }

    console.log(somaDeNumeros(2, 3, 15, 15))

  </script>
