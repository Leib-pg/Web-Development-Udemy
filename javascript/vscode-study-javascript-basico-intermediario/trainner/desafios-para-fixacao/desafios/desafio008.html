<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>criando um tabuada de 1 a 10 (laços encadeados) usando while</title>
<script>

  let numero = 1;

    while(numero <= 10) {
      console.log("Tabuada do " + numero);
      let mult = 1;
    }

    while(mult <= 10) {
      let resultado = numero * mult;
      console.log(numero + 'x' + mult + '=' + resultado);
      mult++;
    }
 


</script>
